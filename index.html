<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Submission Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #f4f6fb;
  padding: 20px;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

label {
  font-weight: bold;
  margin-top: 15px;
  display: block;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

input:disabled {
  background: #e9ecef;
}

.autocomplete-box {
  position: relative;
}

.suggestions {
  position: absolute;
  width: 100%;
  background: white;
  border: 1px solid #ccc;
  max-height: 180px;
  overflow-y: auto;
  z-index: 10;
}

.suggestion-item {
  padding: 10px;
  cursor: pointer;
}

.suggestion-item:hover {
  background: #eee;
}

.photo-card {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  background: #fafafa;
}

.checkbox-group label {
  font-weight: normal;
}

button {
  margin-top: 20px;
  background: #1f4e79;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.status {
  margin-top: 15px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">
<h1>Photo Submission</h1>

<form id="form">

<label>Rep Name</label>
<div class="autocomplete-box">
  <input id="repName" autocomplete="off" required>
  <div id="repSuggestions" class="suggestions"></div>
</div>

<label>Account Name</label>
<div class="autocomplete-box">
  <input id="accountName" autocomplete="off" required>
  <div id="accountSuggestions" class="suggestions"></div>
</div>

<label>Account ID</label>
<input id="accountId" disabled>

<label>Upload Photos (Max 5)</label>
<input type="file" id="photos" multiple accept="image/*" required>

<div id="photoFields"></div>

<button type="submit">Submit</button>

<div id="status" class="status"></div>

</form>
</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPnIkuLKGnCn6eJUPDVhS8nFLQyQ0hzGHYlUlzUfzqvtf91JfAvttKD_AlY4fAYRp6sg/exec";

let reps = [];
let accounts = [];

/* LOAD DATA */
async function loadData() {
  const res = await fetch(WEB_APP_URL + "?action=getData");
  const data = await res.json();

  reps = data.reps || [];
  accounts = data.accounts || [];

  setupAutocomplete("repName", "repSuggestions", reps, () => {});
  setupAutocomplete("accountName", "accountSuggestions", accounts, (item) => {
    document.getElementById("accountId").value = item.id;
  });
}

/* AUTOCOMPLETE */
function setupAutocomplete(inputId, boxId, data, onSelect) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(boxId);

  input.addEventListener("input", () => {
    const value = input.value.toLowerCase();
    box.innerHTML = "";

    if (!value) return;

    const matches = data.filter(x =>
      x.name.toLowerCase().includes(value)
    ).slice(0, 10);

    matches.forEach(item => {
      const div = document.createElement("div");
      div.className = "suggestion-item";
      div.textContent = item.name;

      div.addEventListener("mousedown", () => {
        input.value = item.name;
        box.innerHTML = "";
        onSelect(item);
      });

      box.appendChild(div);
    });
  });

  input.addEventListener("blur", () => {
    setTimeout(() => box.innerHTML = "", 150);
  });
}

/* PHOTO FIELDS */
document.getElementById("photos").addEventListener("change", function () {
  const files = Array.from(this.files);
  const container = document.getElementById("photoFields");

  container.innerHTML = "";

  if (files.length > 5) {
    alert("Max 5 photos.");
    this.value = "";
    return;
  }

  files.forEach((file, i) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    card.innerHTML = `
      <h3>Photo ${i+1}: ${file.name}</h3>

      <label>Select P(s)</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="P1 Product Assortment" name="p-${i}"> P1: Product Assortment</label>
        <label><input type="checkbox" value="P2 Pricing" name="p-${i}"> P2: Pricing</label>
        <label><input type="checkbox" value="P3 Placement" name="p-${i}"> P3: Placement</label>
        <label><input type="checkbox" value="P4 Promotions" name="p-${i}"> P4: Promotions</label>
        <label><input type="checkbox" value="P5 People" name="p-${i}"> P5: People</label>
        <label><input type="checkbox" value="P6 Point of Sale" name="p-${i}"> P6: Point of Sale</label>
      </div>

      <label>Tactic</label>
      <select name="tactic-${i}">
        <option value="">Select</option>
        <option>Coldbox</option>
        <option>Menu</option>
        <option>Shelf</option>
        <option>Staff Training</option>
        <option>25cs+ Display</option>
        <option>5cs+ Display</option>
        <option>Backbar</option>
        <option>Other</option>
      </select>
    `;

    container.appendChild(card);
  });
});

/* BASE64 */
function toBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result.split(",")[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

/* SUBMIT */
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const status = document.getElementById("status");
  status.innerText = "Submitting...";

  const repName = document.getElementById("repName").value;
  const accountName = document.getElementById("accountName").value;
  const accountId = document.getElementById("accountId").value;
  const files = Array.from(document.getElementById("photos").files);

  if (!accountId) {
    status.innerText = "Select valid account.";
    return;
  }

  const photos = [];

  for (let i = 0; i < files.length; i++) {
    const p = Array.from(document.querySelectorAll(`input[name="p-${i}"]:checked`))
      .map(x => x.value)
      .join(", ");

    const tactic = document.querySelector(`[name="tactic-${i}"]`).value;

    if (!p || !tactic) {
      status.innerText = "Fill all photo fields.";
      return;
    }

    photos.push({
      originalFileName: files[i].name,
      mimeType: files[i].type,
      base64: await toBase64(files[i]),
      pSelection: p,
      tactic: tactic
    });
  }

  const payload = { repName, accountName, accountId, photos };

  try {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await res.json();

    if (result.success) {
      status.innerText = "Submitted successfully";
      document.getElementById("form").reset();
      document.getElementById("photoFields").innerHTML = "";
      document.getElementById("accountId").value = "";
    } else {
      throw new Error(result.message);
    }

  } catch (err) {
    status.innerText = "Error: " + err.message;
  }
});

/* INIT */
loadData();

</script>
</body>
</html>
