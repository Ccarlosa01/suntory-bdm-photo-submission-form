<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Submission Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #f4f6fb;
  padding: 20px;
}

.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 { text-align: center; }

label {
  font-weight: bold;
  margin-top: 15px;
  display: block;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

input:disabled { background: #e9ecef; }

.autocomplete-box { position: relative; }

.suggestions {
  position: absolute;
  width: 100%;
  background: white;
  border: 1px solid #ccc;
  max-height: 180px;
  overflow-y: auto;
  z-index: 10;
}

.suggestion-item {
  padding: 10px;
  cursor: pointer;
}

.suggestion-item:hover { background: #eee; }

.photo-card {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  background: #fafafa;
}

.photo-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.remove-btn {
  width: auto;
  background: #b00020;
  padding: 8px 12px;
  margin-top: 0;
}

.checkbox-group label {
  font-weight: normal;
  margin-top: 8px;
}

.checkbox-group input {
  width: auto;
  margin-right: 8px;
}

button {
  margin-top: 20px;
  background: #1f4e79;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #173b5c; }

.secondary-btn {
  background: #2f6f9f;
}

.status {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h1>Photo Submission</h1>

<form id="form">

<label>Rep Name</label>
<div class="autocomplete-box">
  <input id="repName" autocomplete="off" required>
  <div id="repSuggestions" class="suggestions"></div>
</div>

<label>Account Name</label>
<div class="autocomplete-box">
  <input id="accountName" autocomplete="off" required>
  <div id="accountSuggestions" class="suggestions"></div>
</div>

<label>Account ID</label>
<input id="accountId" disabled>

<div id="photoFields"></div>

<button type="button" class="secondary-btn" onclick="addPhotoCard()">+ Add Photo</button>

<button type="submit">Submit All Photos</button>

<div id="status" class="status"></div>

</form>
</div>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyPnIkuLKGnCn6eJUPDVhS8nFLQyQ0hzGHYlUlzUfzqvtf91JfAvttKD_AlY4fAYRp6sg/exec";

let reps = [];
let accounts = [];
let photoCount = 0;
const MAX_PHOTOS = 5;

/* LOAD DATA */
async function loadData() {
  const res = await fetch(WEB_APP_URL + "?action=getData");
  const data = await res.json();

  reps = data.reps || [];
  accounts = data.accounts || [];

  setupAutocomplete("repName", "repSuggestions", reps, () => {});
  setupAutocomplete("accountName", "accountSuggestions", accounts, (item) => {
    document.getElementById("accountId").value = item.id;
  });
}

/* AUTOCOMPLETE */
function setupAutocomplete(inputId, boxId, data, onSelect) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(boxId);

  input.addEventListener("input", () => {
    const value = input.value.toLowerCase();
    box.innerHTML = "";

    if (!value) return;

    const matches = data.filter(x =>
      x.name.toLowerCase().includes(value)
    ).slice(0, 10);

    matches.forEach(item => {
      const div = document.createElement("div");
      div.className = "suggestion-item";
      div.textContent = item.name;

      div.addEventListener("mousedown", () => {
        input.value = item.name;
        box.innerHTML = "";
        onSelect(item);
      });

      box.appendChild(div);
    });
  });

  input.addEventListener("blur", () => {
    setTimeout(() => box.innerHTML = "", 150);
  });
}

/* ADD ONE PHOTO CARD AT A TIME */
function addPhotoCard() {
  const currentCards = document.querySelectorAll(".photo-card").length;

  if (currentCards >= MAX_PHOTOS) {
    alert("You can only add up to 5 photos.");
    return;
  }

  photoCount++;

  const index = photoCount;
  const container = document.getElementById("photoFields");

  const card = document.createElement("div");
  card.className = "photo-card";
  card.dataset.index = index;

  card.innerHTML = `
    <div class="photo-header">
      <h3>Photo ${currentCards + 1}</h3>
      <button type="button" class="remove-btn" onclick="removePhotoCard(this)">Remove</button>
    </div>

    <label>Attach Photo</label>
    <input type="file" name="photoFile-${index}" accept="image/*" required>

    <label>Select P(s)</label>
    <div class="checkbox-group">
      <label><input type="checkbox" value="P1 Product Assortment" name="p-${index}"> P1: Product Assortment</label>
      <label><input type="checkbox" value="P2 Pricing" name="p-${index}"> P2: Pricing</label>
      <label><input type="checkbox" value="P3 Placement" name="p-${index}"> P3: Placement</label>
      <label><input type="checkbox" value="P4 Promotions" name="p-${index}"> P4: Promotions</label>
      <label><input type="checkbox" value="P5 People" name="p-${index}"> P5: People</label>
      <label><input type="checkbox" value="P6 Point of Sale" name="p-${index}"> P6: Point of Sale</label>
    </div>

    <label>Tactic</label>
    <select name="tactic-${index}" onchange="handleOtherTactic(this, ${index})" required>
      <option value="">Select</option>
      <option value="Coldbox">Coldbox</option>
      <option value="Menu">Menu</option>
      <option value="Shelf">Shelf</option>
      <option value="Staff Training">Staff Training</option>
      <option value="25cs+ Display">25cs+ Display</option>
      <option value="5cs+ Display">5cs+ Display</option>
      <option value="Backbar">Backbar</option>
      <option value="Other">Other</option>
    </select>

    <input
      type="text"
      name="other-${index}"
      placeholder="Enter custom tactic..."
      maxlength="60"
      style="display:none; margin-top:8px;"
    >
  `;

  container.appendChild(card);
  renumberPhotoCards();
}

/* REMOVE PHOTO CARD */
function removePhotoCard(button) {
  button.closest(".photo-card").remove();
  renumberPhotoCards();
}

/* RENUMBER VISIBLE PHOTO CARDS */
function renumberPhotoCards() {
  const cards = document.querySelectorAll(".photo-card");
  cards.forEach((card, i) => {
    card.querySelector("h3").innerText = `Photo ${i + 1}`;
  });
}

/* OTHER TACTIC SHORT ANSWER */
function handleOtherTactic(select, index) {
  const input = document.querySelector(`input[name="other-${index}"]`);

  if (select.value === "Other") {
    input.style.display = "block";
    input.required = true;
  } else {
    input.style.display = "none";
    input.required = false;
    input.value = "";
  }
}

/* BASE64 */
function toBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result.split(",")[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

/* SUBMIT */
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();

  const status = document.getElementById("status");
  status.innerText = "Submitting...";

  const repName = document.getElementById("repName").value.trim();
  const accountName = document.getElementById("accountName").value.trim();
  const accountId = document.getElementById("accountId").value.trim();

  if (!accountId) {
    status.innerText = "Please select a valid account from the dropdown.";
    return;
  }

  const cards = Array.from(document.querySelectorAll(".photo-card"));

  if (cards.length === 0) {
    status.innerText = "Please add at least one photo.";
    return;
  }

  const photos = [];

  for (const card of cards) {
    const index = card.dataset.index;

    const fileInput = document.querySelector(`input[name="photoFile-${index}"]`);
    const file = fileInput.files[0];

    if (!file) {
      status.innerText = "Please attach a photo for every photo card.";
      return;
    }

    const p = Array.from(document.querySelectorAll(`input[name="p-${index}"]:checked`))
      .map(x => x.value)
      .join(", ");

    let tactic = document.querySelector(`[name="tactic-${index}"]`).value;

    if (tactic === "Other") {
      const otherVal = document.querySelector(`[name="other-${index}"]`).value.trim();

      if (!otherVal) {
        status.innerText = "Please enter a custom tactic for 'Other'.";
        return;
      }

      tactic = otherVal;
    }

    if (!p || !tactic) {
      status.innerText = "Please complete all P and tactic fields.";
      return;
    }

    photos.push({
      originalFileName: file.name,
      mimeType: file.type,
      base64: await toBase64(file),
      pSelection: p,
      tactic: tactic
    });
  }

  const payload = { repName, accountName, accountId, photos };

  try {
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await res.json();

    if (result.success) {
      status.innerText = "Submitted successfully.";
      document.getElementById("form").reset();
      document.getElementById("photoFields").innerHTML = "";
      document.getElementById("accountId").value = "";
      photoCount = 0;
      addPhotoCard();
    } else {
      throw new Error(result.message);
    }

  } catch (err) {
    status.innerText = "Error: " + err.message;
  }
});

/* INIT */
loadData();
addPhotoCard();

</script>
</body>
</html>
